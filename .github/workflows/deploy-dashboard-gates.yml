name: Deploy dashboard gates

on:
  pull_request:
    paths:
      - "deploy-dashboard/**"
      - ".github/workflows/deploy-dashboard-gates.yml"
  push:
    branches:
      - main
    paths:
      - "deploy-dashboard/**"
      - ".github/workflows/deploy-dashboard-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run status-engine tests
        run: npm test

      - name: Type-check dashboard
        run: npm run typecheck

      - name: Build production package
        run: npm run build
