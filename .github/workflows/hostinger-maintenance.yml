name: Hostinger maintenance

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Maintenance job to run
        required: true
        type: choice
        default: daily-cleanup
        options:
          - daily-cleanup
          - diagnostics-retention
          - all

permissions:
  contents: read

concurrency:
  group: hostinger-maintenance-${{ github.event.schedule || inputs.job || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostics-retention:
    if: >-
      github.event.schedule == '17 3 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'diagnostics-retention' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run diagnostics retention
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET repository secret is missing"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 2 --max-time 60 \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://weknowenglish.online/api/cron/diagnostics-retention

  daily-cleanup:
    if: >-
      github.event.schedule == '7,37 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'daily-cleanup' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Daily classroom cleanup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET repository secret is missing"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 2 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://weknowenglish.online/api/cron/daily-cleanup