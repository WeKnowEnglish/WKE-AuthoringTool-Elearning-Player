name: Web release gates

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - ".github/workflows/web-release-gates.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "packages/**"
      - ".github/workflows/web-release-gates.yml"
  workflow_dispatch:

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_STUDENT_SELF_REGISTRATION_ENABLED: "false"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_ANON_KEY: "ci-placeholder-key"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-key"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Lint
        run: npm run lint -- --quiet

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install browser
        run: npx playwright install chromium

      - name: Browser safety checks
        run: npm run test:e2e

      - name: Build
        run: npm run build
