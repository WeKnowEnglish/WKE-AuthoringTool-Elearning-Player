<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Fixed crash-site scene map</title>
  <desc id="description">Top-down production map fixing the spacecraft on the west side, the tree hollow on the east side, each backpack with its child, the four children between the ship and Keelan, and the approved camera side south of the story axis.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe5ca"/>
    </linearGradient>
    <linearGradient id="clearing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#728b4a"/>
      <stop offset="1" stop-color="#3f633c"/>
    </linearGradient>
    <radialGradient id="shipMetal" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#647078"/>
      <stop offset="0.55" stop-color="#303a40"/>
      <stop offset="1" stop-color="#151c21"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#182216" flood-opacity="0.35"/>
    </filter>
    <pattern id="forestDots" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="15" r="7" fill="#294f32"/>
      <circle cx="35" cy="29" r="10" fill="#1f452d"/>
      <circle cx="48" cy="8" r="5" fill="#527340"/>
    </pattern>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#315d42"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1d75a8"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect x="34" y="34" width="1532" height="932" rx="26" fill="none" stroke="#5d4c2e" stroke-width="4"/>

  <text x="80" y="92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#203a2a">FIXED CRASH-SITE SCENE MAP</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="18" fill="#5d654e">Production canon v1.1 | Applies from Chapter 1, Page 4 through the opening crash-site sequence</text>
  <text x="1470" y="94" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#203a2a">N</text>
  <path d="M1470 112 L1470 150" stroke="#203a2a" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="80" y="160" width="1440" height="650" rx="28" fill="url(#clearing)" stroke="#294632" stroke-width="5" filter="url(#softShadow)"/>
  <rect x="80" y="160" width="1440" height="92" rx="28" fill="url(#forestDots)" opacity="0.95"/>
  <rect x="80" y="718" width="1440" height="92" rx="28" fill="url(#forestDots)" opacity="0.95"/>
  <rect x="80" y="160" width="92" height="650" rx="28" fill="url(#forestDots)" opacity="0.95"/>
  <rect x="1428" y="160" width="92" height="650" rx="28" fill="url(#forestDots)" opacity="0.95"/>

  <path d="M495 487 C650 430 780 438 920 472 C1050 504 1135 508 1248 478" fill="none" stroke="#c8ad70" stroke-width="128" stroke-linecap="round" opacity="0.82"/>
  <path d="M495 487 C650 430 780 438 920 472 C1050 504 1135 508 1248 478" fill="none" stroke="#e7d39d" stroke-width="82" stroke-linecap="round" opacity="0.92"/>
  <path d="M620 660 C790 700 980 680 1115 615" fill="none" stroke="#315d42" stroke-width="5" stroke-dasharray="16 12" marker-end="url(#arrowGreen)"/>
  <text x="850" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e9f1df">CHILDREN MOVE EAST TOWARD THE HOLLOW</text>

  <g transform="translate(365 475) rotate(-10)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="240" ry="145" fill="url(#shipMetal)" stroke="#10171c" stroke-width="8"/>
    <ellipse cx="0" cy="-14" rx="118" ry="78" fill="#3f4c53" stroke="#1a252b" stroke-width="7"/>
    <ellipse cx="0" cy="-17" rx="64" ry="43" fill="#1d2a31" stroke="#7f8c91" stroke-width="4"/>
    <g fill="#31b9ef" stroke="#a5e9ff" stroke-width="2">
      <circle cx="-184" cy="-27" r="8"/><circle cx="-132" cy="-92" r="8"/><circle cx="-52" cy="-126" r="8"/>
      <circle cx="54" cy="-126" r="8"/><circle cx="136" cy="-88" r="8"/><circle cx="186" cy="-22" r="8"/>
      <circle cx="-164" cy="70" r="8"/><circle cx="-78" cy="112" r="8"/><circle cx="75" cy="111" r="8"/>
    </g>
    <path d="M190 -50 C242 -44 258 -13 244 30 C232 66 199 79 167 65 L156 23 C174 8 182 -18 190 -50 Z" fill="#0b1318" stroke="#56c9f4" stroke-width="6"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c9d5da">CRASHED SAUCER</text>
  </g>

  <path d="M570 462 L650 462" stroke="#1d75a8" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="455" y="318" width="294" height="40" rx="20" fill="#d9eef7" opacity="0.94"/>
  <text x="602" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173f58">SHIP ENTRANCE FACES EAST</text>

  <rect x="400" y="535" width="430" height="40" rx="20" fill="#edf2dc" opacity="0.94"/>
  <text x="615" y="561" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#243f2c">BACKPACKS REMAIN WITH THEIR OWNERS</text>

  <g transform="translate(1290 468)" filter="url(#softShadow)">
    <path d="M-172 116 C-118 40 -116 -62 -78 -146 C-30 -245 46 -244 94 -148 C132 -72 126 35 178 120" fill="#5a3a25" stroke="#352219" stroke-width="16" stroke-linecap="round"/>
    <path d="M-166 114 C-92 94 -68 83 -38 76" fill="none" stroke="#6d4b31" stroke-width="28" stroke-linecap="round"/>
    <path d="M170 114 C93 94 70 82 40 75" fill="none" stroke="#6d4b31" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="0" cy="35" rx="88" ry="120" fill="#111513" stroke="#2c2119" stroke-width="10"/>
    <ellipse cx="0" cy="30" rx="46" ry="70" fill="#050706"/>
    <text x="0" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f7efd6">ROOT / TREE HOLLOW</text>
  </g>

  <line x1="745" y1="480" x2="1170" y2="480" stroke="#233427" stroke-width="4" stroke-dasharray="18 10"/>
  <rect x="790" y="272" width="335" height="42" rx="21" fill="#f5ebcb" opacity="0.94"/>
  <text x="957" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#233427">STORY AXIS: WEST ↔ EAST</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(830 350)">
      <circle r="34" fill="#3f8748" stroke="#f5f0dc" stroke-width="6"/>
      <text y="6" fill="#ffffff">E</text><text x="52" y="6" text-anchor="start" fill="#19331d">ETHAN</text>
    </g>
    <g transform="translate(865 425)">
      <circle r="34" fill="#2c79b8" stroke="#f5f0dc" stroke-width="6"/>
      <text y="6" fill="#ffffff">L</text><text x="52" y="6" text-anchor="start" fill="#19314a">LEO</text>
    </g>
    <g transform="translate(865 540)">
      <circle r="34" fill="#7a4e9b" stroke="#f5f0dc" stroke-width="6"/>
      <text y="6" fill="#ffffff">M</text><text x="52" y="6" text-anchor="start" fill="#3b244e">MIA</text>
    </g>
    <g transform="translate(830 615)">
      <circle r="34" fill="#e7b93d" stroke="#f5f0dc" stroke-width="6"/>
      <text y="6" fill="#30250d">Z</text><text x="52" y="6" text-anchor="start" fill="#4d3d15">ZARA</text>
    </g>
    <g transform="translate(1128 480)">
      <circle r="43" fill="#238dbb" stroke="#f29442" stroke-width="8"/>
      <path d="M-29 -20 L-57 -49 L-48 -5 Z M29 -20 L57 -49 L48 -5 Z" fill="#238dbb" stroke="#f29442" stroke-width="5"/>
      <text y="7" fill="#ffffff">K</text><text x="0" y="74" fill="#153a4c">KEELAN</text>
    </g>
  </g>

  <path d="M1080 480 L1005 480" stroke="#1d75a8" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="1042" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173f58">KEELAN FACES WEST</text>

  <g transform="translate(1010 755)">
    <path d="M0 0 L-35 52 L35 52 Z" fill="#263e56"/>
    <circle cx="0" cy="35" r="10" fill="#79c7ef"/>
    <path d="M0 -6 L-160 -250 M0 -6 L160 -250" stroke="#263e56" stroke-width="3" stroke-dasharray="12 10" opacity="0.8"/>
    <text x="0" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#23354a">APPROVED CAMERA SIDE: SOUTH OF AXIS</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="80" y="858" font-size="22" font-weight="700" fill="#203a2a">FIXED CONTINUITY RULES</text>
    <text x="80" y="895" font-size="18" fill="#273b2c">1. Ship remains west/left.  2. Hollow remains east/right.  3. Backpacks stay with their owners.</text>
    <text x="80" y="925" font-size="18" fill="#273b2c">4. Keelan begins at the hollow threshold facing west.  5. Children stand between ship and Keelan, facing east.</text>
    <text x="80" y="955" font-size="18" fill="#273b2c">6. Keep the camera south of the story axis unless an establishing panel clearly shows the crossing.</text>
  </g>
</svg>
